[pytest]
testpaths = tests
# Lets tests `import sketch_io` / `uniqhll12` without a package install or sys.path hacks.
pythonpath = .

markers =
    druid: needs a running Druid with the fixture datasource
    clickhouse: needs a running ClickHouse
    integration: needs at least one live server

# Integration tests skip themselves when their server is unreachable (see conftest.py), so a
# bare `pytest` run works with nothing running. To skip them outright:
#   .venv/bin/pytest -m "not integration"
addopts = -ra --strict-markers
