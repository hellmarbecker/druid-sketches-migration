# GET -> POST shim so ClickHouse's url() can query Druid.
#
# Druid's /druid/v2/sql accepts POST with a JSON body and returns 405 for GET, while
# ClickHouse's url() table function only ever issues GET for SELECT and has no method or
# body parameter. nginx bridges the two: proxy_method rewrites the verb and proxy_set_body
# supplies the JSON envelope, so a plain GET from ClickHouse becomes a well-formed Druid
# query. No third-party modules -- this is stock nginx.
#
# Run:
#   mkdir -p /tmp/nginx-druid/logs
#   nginx -p /tmp/nginx-druid -c <repo>/nginx/druid-get-to-post.conf
#   nginx -p /tmp/nginx-druid -c <repo>/nginx/druid-get-to-post.conf -s stop
#
# Then from ClickHouse:
#   SELECT * FROM url('http://127.0.0.1:8890/named/rollup-theta', 'JSONEachRow', '<structure>');

worker_processes  1;
error_log         /tmp/nginx-druid/logs/error.log warn;
pid               /tmp/nginx-druid/logs/nginx.pid;

events { worker_connections 64; }

http {
    access_log  /tmp/nginx-druid/logs/access.log;
    default_type application/json;

    # Druid can be slow on wide GROUP BYs; don't cut it off mid-scan.
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    proxy_buffering       off;

    upstream druid_broker { server 127.0.0.1:8888; }

    server {
        listen      127.0.0.1:8890;
        server_name druid-shim;

        # ------------------------------------------------------------------ ad-hoc queries
        # SQL travels in the path, url-encoded. nginx decodes the URI while normalising it,
        # before location matching, so $sql arrives as plain text -- which is why the path
        # is used rather than a query argument: $arg_* is NOT decoded.
        #
        #   /q/SELECT%20channel%20FROM%20wikipedia_rollup_sketches%20LIMIT%205
        #
        # CAVEAT: the value is interpolated straight into a JSON string literal. nginx has no
        # JSON escaping, so any double quote or backslash in the SQL must already be escaped
        # by the caller (send \" for a literal quote). Druid needs quotes for reserved words
        # like "count", so this matters in practice -- prefer a named query below when the
        # SQL is fixed, and keep this for exploration.
        # A regex location cannot carry a URI in proxy_pass, so the target path is set with
        # `rewrite ... break` and proxy_pass names only the upstream. The capture is taken
        # during location matching, which happens before the rewrite, so $sql survives it.
        location ~ ^/q/(?<sql>.+)$ {
            rewrite           ^ /druid/v2/sql break;
            proxy_method      POST;
            proxy_set_header  Content-Type application/json;
            proxy_set_body    '{"query":"$sql","resultFormat":"objectLines"}';
            proxy_pass        http://druid_broker;
        }

        # ------------------------------------------------------------------ named queries
        # Fixed SQL held server-side. No escaping hazard, nothing to encode at the call site,
        # and the query is reviewable in one place -- the better choice for a migration.

        # Note the doubled backslashes. nginx's config parser consumes one level of escaping
        # inside a quoted value, so \\" is what reaches the wire as \" -- which is what JSON
        # needs for the quotes Druid requires around the reserved word `count`. Writing \"
        # here emits a bare quote and terminates the JSON string early.
        location = /named/rollup-theta {
            proxy_method      POST;
            proxy_set_header  Content-Type application/json;
            proxy_set_body    '{"query":"SELECT __time, channel, countryName, isRobot, \\"count\\" AS cnt, sum_added, users_theta_16384, pages_theta_4096 FROM wikipedia_rollup_sketches","resultFormat":"objectLines"}';
            proxy_pass        http://druid_broker/druid/v2/sql;
        }

        location = /named/rollup-hll {
            proxy_method      POST;
            proxy_set_header  Content-Type application/json;
            proxy_set_body    '{"query":"SELECT __time, channel, countryName, isRobot, users_hll_k12_hll4, pages_hll_k14_hll8 FROM wikipedia_rollup_sketches","resultFormat":"objectLines"}';
            proxy_pass        http://druid_broker/druid/v2/sql;
        }

        # Liveness of the shim itself; proxied as a plain GET, which Druid does allow here.
        location = /health {
            proxy_pass http://druid_broker/status/health;
        }
    }
}
